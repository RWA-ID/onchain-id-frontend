    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is Onchain ID?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Onchain ID is a programmable identity layer for robots, machines, devices, and autonomous systems. It provides verifiable onchain identities powered by Ethereum and ENS-based naming, allowing manufacturers and operators to issue, manage, and verify machine identities at scale."
          }
        },
        {
          "@type": "Question",
          "name": "Is this custody?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. Onchain ID is not a custody provider and does not hold customer funds. OEMs and users control their own keys and wallets. We provide naming and identity infrastructure only — you maintain full control over your assets and operations."
          }
        },
        {
          "@type": "Question",
          "name": "Do I need a license?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "License holders can issue unlimited subdomains under their licensed namespace with no per-subdomain fees. Non-holders can pay per subdomain with tiered pricing: $4.50 for 1-10 units, $3.00 for 11-50 units, and $1.50 for 51+ units. For high-volume issuers, the $99,000 unlimited license provides the best long-term value."
          }
        },
        {
          "@type": "Question",
          "name": "How does subdomain registration work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Connect your wallet, select a namespace (robot-id.eth, drone-id.eth, etc.), enter a name or upload a CSV for bulk registration, and confirm the transaction. Your subdomains are minted as ENS names wrapped in the ENS NameWrapper contract, giving you full ownership and control."
          }
        },
        {
          "@type": "Question",
          "name": "Are Onchain ID names interoperable?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. Onchain ID names are standard ENS subdomains and can be resolved by any ENS-compatible application, wallet, or service. They work across the entire Ethereum ecosystem and can be integrated into existing workflows without custom infrastructure."
          }
        }
      ]
    }
